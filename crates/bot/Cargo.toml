[package]
name = "bot"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.100"
dotenvy = "0.15.7"
log = "0.4.29"
pretty_env_logger = "0.5.0"
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
thousands = "0.2"

# workspace crates
app = { path = "../app" }
db = { path = "../db" }
uuid = "1.19.0"

[package]
name = "db"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "uuid", "chrono"] }
tokio = { version = "1.38", features = ["macros", "rt-multi-thread"] }
dotenvy = "0.15"
anyhow = "1.0"
uuid = "1.19.0"
chrono = "0.4.42"
async-trait = "0.1.89"

app = { path = "../app" }

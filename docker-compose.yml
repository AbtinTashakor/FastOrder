version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: fastorder-postgres
    environment:
      POSTGRES_DB: fastorder
      POSTGRES_USER: fastorder
      POSTGRES_PASSWORD: fastorder
    ports:
      - "5432:5432"
    volumes:
      - fastorder_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  fastorder_pgdata:
